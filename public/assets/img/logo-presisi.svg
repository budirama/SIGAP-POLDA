<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="presisiGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="policeNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Badge Container Pill -->
  <rect x="5" y="10" width="410" height="100" rx="16" fill="url(#policeNavy)" stroke="url(#presisiGold)" stroke-width="2" filter="url(#badgeShadow)"/>

  <!-- Left Emblem Icon: Target / Precision Radar with 3 Stars -->
  <g transform="translate(60, 60)">
    <!-- Outer Radar Rings -->
    <circle cx="0" cy="0" r="36" fill="#0E2246" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="26" fill="#173160" stroke="#F59E0B" stroke-width="1.8"/>
    <!-- Crosshairs -->
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#FCD34D" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="#FCD34D" stroke-width="1.2" opacity="0.7"/>
    <!-- Center Target Diamond -->
    <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#presisiGold)" stroke="#805300" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    
    <!-- 3 Mini Stars -->
    <g transform="translate(-14, -20) scale(0.35)" fill="#F59E0B"><polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3"/></g>
    <g transform="translate(0, -25) scale(0.42)" fill="#FCD34D"><polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3"/></g>
    <g transform="translate(14, -20) scale(0.35)" fill="#F59E0B"><polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3"/></g>
  </g>

  <!-- Divider Line -->
  <line x1="120" y1="25" x2="120" y2="95" stroke="#334155" stroke-width="1.5"/>

  <!-- Typography: POLRI PRESISI -->
  <text x="135" y="44" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#E2E8F0" letter-spacing="4">
    POLRI
  </text>
  <text x="135" y="78" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="34" font-weight="900" fill="url(#presisiGold)" letter-spacing="2">
    PRESISI
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="135" y="96" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="0.8">
    PREDIKTIF • RESPONSIBILITAS • TRANSPARANSI BERKEADILAN
  </text>
</svg>
